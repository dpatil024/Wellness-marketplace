<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>wellness-marketplace</title>
    <!--
      GitHub Pages serves this for any unknown path (e.g. a direct load of
      /creators/maya-reyes, or a refresh on that route) since it has no
      server-side router. This redirects back to index.html with the real
      path encoded in the query string; index.html's inline script below
      decodes it and hands off to react-router. See:
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var segmentCount = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(segmentCount)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search
            ? '&' + l.search.slice(1).replace(/&/g, '~and~')
            : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
